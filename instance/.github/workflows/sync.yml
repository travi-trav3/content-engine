name: sync

# Reads the engine's drafts back from Buffer and acts on what the reviewer
# did: a note revises the post and swaps the new images into the same
# draft; caption edits, approvals and deletes are recorded for the next
# batch. Every 15 minutes, 7am to 7pm Pacific (an hour earlier in winter).
#
# GitHub bills each run as at least a minute: this schedule is about 1,450
# minutes a month. Every 30 minutes halves it; around the clock would be
# about 2,900. A run with no open drafts makes no Buffer request at all; a
# run with open drafts makes one, plus one per change it acts on.

on:
  schedule:
    - cron: '*/15 14-23,0-1 * * *'
  workflow_dispatch:

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

# The brand workspace: set by scripts/make-instance.js.
env:
  CE_WORKSPACE: __WS__

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Most runs have nothing to render: they read Buffer, record what the
      # reviewer did, and stop. A note that needs a new image leaves
      # needs-render.txt, and only then is Chromium installed for a second pass.
      - name: Sync with Buffer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ASSETS_PUSH_TOKEN: ${{ secrets.ASSETS_PUSH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node engine/buffer/sync.js --defer-renders

      - name: Install Chromium for the notes
        if: hashFiles('needs-render.txt') != ''
        run: npx playwright-core install --with-deps chromium

      - name: Revise from the notes
        if: hashFiles('needs-render.txt') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ASSETS_PUSH_TOKEN: ${{ secrets.ASSETS_PUSH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node engine/buffer/sync.js

      - name: Commit what changed
        if: always()
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          for d in content feedback; do if [ -e "$CE_WORKSPACE/$d" ]; then git add "$CE_WORKSPACE/$d"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "sync: reviewer activity from Buffer [skip ci]"
          git pull --rebase
          git push
