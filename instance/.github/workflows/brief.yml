name: brief

# When a brief lands in briefs/ (a monthly content map, a list of ideas;
# Word, Markdown or text), read it once, save the reading beside it
# (<name>.json, which a person can correct), and tell the reviewer what the
# engine will use and what in it trips a check, before any batch is planned
# from it.

on:
  push:
    paths:
      - '__WS__/briefs/**'
      - '!__WS__/briefs/**/*.json'
  workflow_dispatch:

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

# The brand workspace: set by scripts/make-instance.js.
env:
  CE_WORKSPACE: __WS__

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read new or changed briefs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node engine/generate/brief.js --notify

      - name: Commit the readings
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          git add "$CE_WORKSPACE/briefs"
          git diff --cached --quiet && exit 0
          git commit -m "brief: read $(git diff --cached --name-only | grep '\.json$' | xargs -n1 basename | tr '\n' ' ')[skip ci]"
          git pull --rebase
          git push
