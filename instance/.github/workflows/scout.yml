name: scout

# Monday mornings: a few new candidate photos, chosen where the library is
# thinnest, screened by the vision reading and left in the Drive folder
# Suggested for the reviewer to move to Active or Rejected. Nothing reaches
# a post until the reviewer moves it.

on:
  schedule:
    - cron: '41 13 * * 1'   # Monday 6:41 Pacific (5:41 in winter)
  workflow_dispatch:

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

# The brand workspace: set by scripts/make-instance.js.
env:
  CE_WORKSPACE: __WS__

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The branch as it is now: the ChatGPT login file may have been refreshed since the run was queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scout
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node engine/photos/scout.js

      - name: Commit what the scout remembers
        if: always()
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          if [ -e "$CE_WORKSPACE/photos/scout.json" ]; then git add "$CE_WORKSPACE/photos/scout.json"; fi
          if [ -e "$CE_WORKSPACE/codex-auth.enc" ]; then git add "$CE_WORKSPACE/codex-auth.enc"; fi
          git diff --cached --quiet && exit 0
          git commit -m "scout: weekly suggestions [skip ci]"
          git pull --rebase
          git push
