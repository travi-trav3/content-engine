name: routine

# The biweekly routine, on the founder's ChatGPT subscription. Weekday
# mornings (Pacific): reads any new brief, writes the next batch when the
# last planned post is under a week away (or finishes one a usage limit
# stopped), writes the founder posts still open, then drafts what is ready
# in Buffer and updates drafts changed since. Codex answers every model call
# with the founder's ChatGPT login (codex-auth.enc in the workspace, opened
# with the CODEX_AUTH_KEY secret); there is no API key. A morning with
# nothing due ends in about a minute without calling Codex.

on:
  schedule:
    - cron: '7 14 * * 1-5'   # weekdays 7:07 Pacific (6:07 in winter)
  workflow_dispatch:
    inputs:
      batch_now:
        description: Write a batch now, even if none is due
        type: boolean
        default: false

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

# The brand workspace: set by scripts/make-instance.js.
env:
  CE_WORKSPACE: __WS__

jobs:
  routine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The branch as it is now, not when the run was queued: the login file may have been refreshed since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is a batch due?
        id: due
        run: echo "batch=$(node engine/routine.js --due ${{ inputs.batch_now && '--batch-now' || '' }})" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.due.outputs.batch == 'yes'
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.due.outputs.batch == 'yes'
        run: npx playwright-core install --with-deps chromium

      - name: Write, with Codex on the ChatGPT subscription
        id: routine
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          node engine/routine.js ${{ inputs.batch_now && '--batch-now' || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 done; 1 some posts need a person (the rest still goes to Buffer);
          # 4 the ChatGPT usage limit (the founder is told; tomorrow's run continues); 2 failed.
          if [ $code -eq 2 ]; then exit 1; fi
          exit 0

      - name: Draft and update in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ASSETS_PUSH_TOKEN: ${{ secrets.ASSETS_PUSH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node engine/buffer/push.js --open

      - name: Commit what changed
        if: always()
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          for d in content feedback briefs sources codex-auth.enc; do if [ -e "$CE_WORKSPACE/$d" ]; then git add "$CE_WORKSPACE/$d"; fi; done
          # Answers of a run a usage limit stopped, kept until it finishes (requests are rebuilt).
          git add -A -- "$CE_WORKSPACE/exchange" 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "routine: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push
